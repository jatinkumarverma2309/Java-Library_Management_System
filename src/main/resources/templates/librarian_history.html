<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Librarian - History</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <nav>
        <div class="brand">Librarian Portal</div>
        <div class="links">
            <a th:href="@{/librarian/dashboard}">Dashboard</a>
            <a th:href="@{/librarian/books}">Books</a>
            <a th:href="@{/librarian/members}">Members</a>
            <a th:href="@{/librarian/history}">History</a>
            <a th:href="@{/logout}" style="color: var(--danger);">Logout</a>
        </div>
    </nav>
    <div class="container">
        <h2>Borrow History</h2>
        <table>
            <thead>
                <tr>
                    <th>Member ID</th>
                    <th>Book ID</th>
                    <th>Borrow Date</th>
                    <th>Return Date</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="h : ${history}">
                    <td th:text="${h.m_id}"></td>
                    <td th:text="${h.b_id}"></td>
                    <td th:text="${h.borrow_date}"></td>
                    <td th:text="${h.return_date}"></td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
