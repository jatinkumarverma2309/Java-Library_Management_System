<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Librarian - Books</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <nav>
        <div class="brand">Librarian Portal</div>
        <div class="links">
            <a th:href="@{/librarian/dashboard}">Dashboard</a>
            <a th:href="@{/librarian/books}">Books</a>
            <a th:href="@{/librarian/members}">Members</a>
            <a th:href="@{/librarian/history}">History</a>
            <a th:href="@{/logout}" style="color: var(--danger);">Logout</a>
        </div>
    </nav>
    <div class="container">
        <h2>Available Books</h2>
        <table>
            <thead>
                <tr>
                    <th>Book ID</th>
                    <th>Name</th>
                    <th>Genre</th>
                    <th>Aisle</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="book : ${books}">
                    <td th:text="${book.b_id}"></td>
                    <td th:text="${book.b_name}"></td>
                    <td th:text="${book.genre}"></td>
                    <td th:text="${book.aisle}"></td>
                    <td>
                        <form th:action="@{/librarian/updateAisle}" method="post" style="display:inline; margin:0; flex-direction:row;">
                            <input type="hidden" name="bId" th:value="${book.b_id}">
                            <input type="number" name="aisle" placeholder="New Aisle" style="width: 100px; padding: 0.3rem;" required>
                            <button type="submit" style="padding: 0.3rem 0.5rem;">Update</button>
                        </form>
                        <form th:action="@{/librarian/deleteBook}" method="post" style="display:inline; margin:0;">
                            <input type="hidden" name="bId" th:value="${book.b_id}">
                            <button type="submit" class="btn-danger" style="padding: 0.3rem 0.5rem;">Delete</button>
                        </form>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
