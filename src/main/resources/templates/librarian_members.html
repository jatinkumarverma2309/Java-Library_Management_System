<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Librarian - Members</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <nav>
        <div class="brand">Librarian Portal</div>
        <div class="links">
            <a th:href="@{/librarian/dashboard}">Dashboard</a>
            <a th:href="@{/librarian/books}">Books</a>
            <a th:href="@{/librarian/members}">Members</a>
            <a th:href="@{/librarian/history}">History</a>
            <a th:href="@{/logout}" style="color: var(--danger);">Logout</a>
        </div>
    </nav>
    <div class="container">
        <h2>Members List</h2>
        <table>
            <thead>
                <tr>
                    <th>Member ID</th>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Contact</th>
                    <th>City</th>
                    <th>Reset Penalty</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="member : ${members}">
                    <td th:text="${member.mId}"></td>
                    <td th:text="${member.mName}"></td>
                    <td th:text="${member.mEmail}"></td>
                    <td th:text="${member.contactInfo}"></td>
                    <td th:text="${member.city}"></td>
                    <td>
                        <form th:action="@{/librarian/resetPenalty}" method="post" style="margin:0;">
                            <input type="hidden" name="mId" th:value="${member.mId}">
                            <button type="submit" style="padding: 0.3rem 0.5rem;">Reset Penalty</button>
                        </form>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
